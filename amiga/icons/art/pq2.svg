  </defs>
  <rect x="6" y="10" width="116" height="110" rx="6" fill="url(#bg)" stroke="#0a0c12" stroke-width="3"/>
  <path d="M64 14 L72 22 L72 70 L56 70 L56 22 Z" fill="url(#blade)" stroke="#2a3040" stroke-width="2"/>
  <rect x="42" y="70" width="44" height="8" rx="2" fill="#d8a020" stroke="#5a3c06" stroke-width="2"/>
  <rect x="59" y="78" width="10" height="14" fill="#7a4a1a" stroke="#3a2008" stroke-width="2"/>
  <rect x="16" y="98" width="96" height="14" rx="3" fill="#0a0e18" stroke="#8090b0" stroke-width="2"/>
  <rect x="19" y="101" width="62" height="8" rx="1" fill="url(#bar)"/>
  <text x="94" y="109" font-family="monospace" font-weight="bold" font-size="9" fill="#e0e6f0">65%</text>
</svg>
